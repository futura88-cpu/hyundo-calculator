<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#c2410c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="현도계산기">
<script src="/app.js" defer></script>
<title>현도 계산기 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #eef0ec; --panel: #ffffff; --ink: #1c231f; --muted: #5d6762; --line: #c8cec9;
  --accent: #c2410c; --accent-soft: #fbe6da;
  --f-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151a17; --panel: #1d2420; --ink: #e6ebe7; --muted: #9aa59f; --line: #34403a; --accent: #fb8a4c; --accent-soft: #3a2418; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); padding: 0 16px; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 32px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.outs { display: flex; gap: 14px; }
[hidden] { display: none !important; }
a.out { color: var(--accent); font-weight: 700; font-size: 13px; text-decoration: none; white-space: nowrap; }
.sub { color: var(--muted); margin: 0 0 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
a.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--accent); }
a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a.card h2 { font-size: 17px; margin: 0 0 6px; color: var(--accent); }
a.card p { margin: 0; color: var(--muted); font-size: 13px; }
a.card span { display: inline-block; margin-top: 12px; font-weight: 700; font-size: 13px; color: var(--accent); }
.copy { margin-top: 28px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.6; }
.copy a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><h1>현도 계산기 모음</h1><span class="outs"><a class="out" href="/admin.html" id="adminLink" hidden>멤버 관리</a><a class="out" href="#" id="logout">로그아웃</a></span></div>
  <p class="sub">배관 현장용 1:1 현도(템플릿) 계산기입니다. 인쇄, PDF, Excel, DXF, SVG로 저장할 수 있습니다. 단위 mm</p>
  <div class="cards">
    <a class="card" href="trunnion-template.html">
      <h2>트러니언 현도 계산기</h2>
      <p>직관 위, 더미 레그(수직), 수평 엘보 트러니언이 주관과 맞닿는 면을 전개합니다.</p>
      <span>열기 →</span>
    </a>
    <a class="card" href="y-tee.html">
      <h2>Y-Tee 현도 계산기</h2>
      <p>주관에 비스듬히 붙는 가지관 끝 현도와 주관 구멍 현도를 함께 출력합니다.</p>
      <span>열기 →</span>
    </a>
  </div>
  <footer class="copy">© 2026 현도 계산기 · 문의: <a href="mailto:futura88@gmail.com">futura88@gmail.com</a></footer>
</div>
<script>
fetch("/api/me").then(function (r) { return r.json(); }).then(function (d) {
  if (d.isAdmin) document.getElementById("adminLink").hidden = false;   // 관리자에게만 메뉴 표시
}).catch(function () {});
document.getElementById("logout").addEventListener("click", function (e) {
  e.preventDefault();
  (window.appClearOffline && window.appClearOffline()); fetch("/api/logout", { method: "POST" }).finally(function () { location.href = "/"; });
});
</script>
</body>
</html>
